---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mala-language-learning
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/ZachPhillipsGary/zpgapi.git
    targetRevision: HEAD
    path: language-learning-platform/k8s/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: language-learning

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - Validate=true
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Health assessment
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas
