apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../../base

namePrefix: prod-

configMapGenerator:
  - name: language-learning-config
    behavior: merge
    literals:
      - DJANGO_ENV=production
      - DEBUG=False

replicas:
  - name: django-backend
    count: 3
  - name: pipecat-service
    count: 2
