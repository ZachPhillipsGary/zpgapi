---
apiVersion: v1
kind: Service
metadata:
  name: django-backend
  namespace: language-learning
spec:
  selector:
    app: django-backend
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: pipecat-service
  namespace: language-learning
spec:
  selector:
    app: pipecat-service
  ports:
  - port: 8001
    targetPort: 8001
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: language-learning
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
  type: ClusterIP
